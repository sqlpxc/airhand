[package]
name = "airhand-android"
description = "Airhand Android core: relay link, controller sessions and the host service, exposed to Kotlin through JNI"
version = "0.2.3"
edition = "2024"
license = "MIT"
publish = false

# 独立的 Cargo 工作区（和 client/src-tauri、web/ 一样），通过路径依赖使用 crates/ 里的库。
# 由 Gradle 用 cargo-ndk 为各个 ABI 编译成 libairhand_android.so（见 ../app/build.gradle.kts）。
[workspace]

[lib]
name = "airhand_android"
# cdylib 给 Android 用；rlib 让 `cargo test` 和 examples 能链接
crate-type = ["cdylib", "rlib"]

[dependencies]
airhand-proto = { path = "../../crates/airhand-proto" }
airhand-link = { path = "../../crates/airhand-link" }
anyhow = "1"
bytes = "1"
jni = "0.21"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
