[package]
name = "airhand-link"
description = "Airhand client side of the relay link: QUIC with certificate pinning and reconnects, session streams, UI-independent controller sessions and the host's server connection"
version = "0.2.2"
edition = "2024"
license = "MIT"

# 桌面客户端（client/src-tauri）、网页控制台（web/）和 Android（android/native）共用，不依赖任何 GUI 库。
# 两者都是独立的 Cargo 工作区；这个库和 airhand-proto 一样属于根目录的工作区（在仓库根目录 cargo test）
[dependencies]
airhand-proto = { path = "../airhand-proto" }
anyhow = "1"
bytes = "1"
curve25519-dalek = "4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# risky-raw-split：取出 Noise 的两把密钥，再派生每条通道、每个方向各自的密钥（见 src/secure.rs）
snow = { version = "0.10", features = ["risky-raw-split"] }
spake2 = "0.4"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
