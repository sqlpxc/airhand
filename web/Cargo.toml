[package]
name = "airhand-web"
description = "Airhand web console: runs the controller on a server or in a container and serves the console to browsers"
version = "0.2.3"
edition = "2024"
license = "MIT"

# 独立工作区（和 client/src-tauri 一样）：中转服务器的工作区和 Docker 构建都不需要网页控制台的代码
[workspace]

[dependencies]
airhand-link = { path = "../crates/airhand-link", features = ["console"] }
airhand-proto = { path = "../crates/airhand-proto" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工作区的 profile 只在工作区根生效，与中转服务器（根目录 Cargo.toml）相同
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
